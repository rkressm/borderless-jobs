[project]
name = "borderless-cli"
version = "0.1.0"
description = "Command-line adapter for Borderless Jobs"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[project.scripts]
borderless = "borderless.cli:main"

[build-system]
requires = ["uv_build==0.12.22"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "borderless.cli"
