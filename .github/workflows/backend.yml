name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned uv wheel
        run: >-
          python -m pip install --require-hashes --no-deps --only-binary=:all:
          -r ci/uv-requirements.txt
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Run offline quality loop
        run: scripts/check-quality.sh all

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned uv wheel
        run: >-
          python -m pip install --require-hashes --no-deps --only-binary=:all:
          -r ci/uv-requirements.txt
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Verify migration cycle
        run: bash scripts/check-migrations.sh
