name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned uv wheel
        run: >-
          python -m pip install --require-hashes --no-deps --only-binary=:all:
          -r ci/uv-requirements.txt
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Run offline quality loop
        run: scripts/check-quality.sh all

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned uv wheel
        run: >-
          python -m pip install --require-hashes --no-deps --only-binary=:all:
          -r ci/uv-requirements.txt
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Verify migration cycle
        run: bash scripts/check-migrations.sh
